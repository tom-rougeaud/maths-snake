<script>
(function(){
'use strict';
// Auteur : Tom Rougeaud
/* =========================================================
   0. NOYAU : constantes, utilitaires, stockage sûr, audio
   ========================================================= */
const APP='mathssnake', VER='v1', PFX=APP+'_'+VER+'_';
const P=JSON.parse(document.getElementById('pedago').textContent);
const WHY=P.why, TXT=P.texts, CHAPS=P.chapters;
const CHAP_BY_ID={}; CHAPS.forEach(c=>CHAP_BY_ID[c.id]=c);
const LINKEDIN='https://www.linkedin.com/in/tomrougeaud';

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[rnd(0,a.length-1)];
const lerp=(a,b,t)=>a+(b-a)*t;
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]];}return a;}
function pad2(x){return String(x).padStart(2,'0');}
function stampFR(d){d=d||new Date();return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());}
function fmt(n){ // nombre à la française : virgule décimale, espace fine pour les milliers
  const r=Math.round(n*100)/100; const s=String(Math.abs(r)).split('.');
  const ip=s[0].replace(/\B(?=(\d{3})+(?!\d))/g,' ');
  return (r<0?'−':'')+ip+(s[1]?','+s[1]:'');
}
function safeFileName(s){return String(s||'').trim().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^\w\-\.]+/g,'_').replace(/^_+|_+$/g,'')||'joueur';}
function csvCell(s){s=String(s==null?'':s).replace(/[\r\n]+/g,' ').replace(/"/g,'""');return '"'+s+'"';}
function downloadBlob(text,mime,name){
  try{const b=new Blob([text],{type:mime});const u=URL.createObjectURL(b);const a=document.createElement('a');
    a.href=u;a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(u);a.remove();},800);return true;}
  catch(e){return false;}
}

/* Stockage : try/catch + repli mémoire, clés préfixées application+version */
const store=(function(){
  const mem={};let ok=true;
  try{const k=PFX+'t';localStorage.setItem(k,'1');localStorage.removeItem(k);}catch(e){ok=false;}
  return{
    get(k,def){try{if(ok){const v=localStorage.getItem(PFX+k);if(v!==null)return JSON.parse(v);}else if(k in mem)return mem[k];}catch(e){}return def;},
    set(k,v){try{if(ok){localStorage.setItem(PFX+k,JSON.stringify(v));return;}}catch(e){}mem[k]=v;},
    clearAll(){try{if(ok){Object.keys(localStorage).filter(x=>x.indexOf(PFX)===0).forEach(x=>localStorage.removeItem(x));}}catch(e){}for(const k in mem)delete mem[k];},
    dump(){const o={};try{if(ok){Object.keys(localStorage).filter(x=>x.indexOf(PFX)===0).forEach(x=>{o[x.slice(PFX.length)]=JSON.parse(localStorage.getItem(x));});}}catch(e){}for(const k in mem)o[k]=mem[k];return o;},
    persistent:ok
  };
})();

/* Audio WebAudio procédural (aucun fichier) */
const SFX=(function(){
  let ac=null,muted=false;
  function ensure(){try{if(!ac){const C=window.AudioContext||window.webkitAudioContext;if(C)ac=new C();}if(ac&&ac.state==='suspended')ac.resume();}catch(e){ac=null;}return ac;}
  function tone(f,d,type,g,delay,slide){
    if(muted)return;const a=ensure();if(!a)return;
    try{const t=a.currentTime+(delay||0);const o=a.createOscillator(),v=a.createGain();
      o.type=type||'sine';o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+d);
      v.gain.setValueAtTime(0.0001,t);v.gain.exponentialRampToValueAtTime(g||0.06,t+0.012);v.gain.exponentialRampToValueAtTime(0.0001,t+d);
      o.connect(v);v.connect(a.destination);o.start(t);o.stop(t+d+0.02);}catch(e){}
  }
  return{
    unlock:ensure,
    setMuted(m){muted=!!m;},isMuted(){return muted;},
    good(){tone(660,.10,'triangle',.07);tone(880,.10,'triangle',.07,.08);tone(1320,.16,'triangle',.06,.16);},
    bad(){tone(240,.22,'sawtooth',.06,0,110);tone(160,.26,'square',.04,.1,80);},
    pop(){tone(520,.06,'sine',.035,0,900);},
    tick(){tone(1000,.04,'square',.025);},
    level(){tone(523,.09,'triangle',.06);tone(659,.09,'triangle',.06,.09);tone(784,.09,'triangle',.06,.18);tone(1047,.2,'triangle',.06,.27);},
    bump(){tone(140,.07,'sine',.05,0,70);},
    over(){tone(392,.18,'triangle',.06);tone(330,.18,'triangle',.06,.18);tone(262,.4,'triangle',.06,.36);},
    click(){tone(760,.05,'sine',.04);}
  };
})();

/* =========================================================
   1. MOTEUR DE QUESTIONS (partie 1) : fabrique + équations + pourcentages
   Chaque gabarit renvoie {text, ans, unit, wrongs:[[valeur, cléPourquoi]], sol}
   Les faux choix viennent de VRAIES erreurs d’élèves (voir WHY dans le JSON).
   ========================================================= */
function mk(text,ans,unit,wrongs,sol){return{text:text,ans:Math.round(ans*100)/100,unit:unit||'',wrongs:wrongs||[],sol:sol||''};}
const GEN={};

/* ---- ÉQUATIONS ---- */
GEN.EQUATION=[
 [ // niveau 1
  ()=>{const x=rnd(4,40),a=rnd(3,20),b=x+a;return mk(`x + ${a} = ${b}`,x,'',[[b+a,'eq_wrongOp'],[b*a%97+1,'near']],`x = ${b} − ${a} = ${x}`);},
  ()=>{const x=rnd(10,60),a=rnd(3,20),b=x-a;return mk(`x − ${a} = ${b}`,x,'',[[b-a,'eq_wrongOp']],`x = ${b} + ${a} = ${x}`);},
  ()=>{const x=rnd(4,40),a=rnd(3,20),b=x+a;return mk(`${a} + x = ${b}`,x,'',[[b+a,'eq_wrongOp']],`x = ${b} − ${a} = ${x}`);}
 ],
 [ // niveau 2
  ()=>{const a=rnd(2,9),x=rnd(3,12),b=a*x;return mk(`${a}x = ${b}`,x,'',[[b*a,'eq_mult'],[b-a,'eq_wrongOp'],[b+a,'eq_wrongOp']],`x = ${b} ÷ ${a} = ${x}`);},
  ()=>{const a=rnd(2,9),b=rnd(3,12),x=a*b;return mk(`x ÷ ${a} = ${b}`,x,'',[[b/a,'eq_div'],[b+a,'eq_wrongOp'],[b-a,'eq_wrongOp']],`x = ${b} × ${a} = ${x}`);}
 ],
 [ // niveau 3
  ()=>{const a=rnd(2,9),x=rnd(3,15),b=rnd(3,25),c=a*x+b;return mk(`${a}x + ${b} = ${c}`,x,'',[[(c+b)/a,'eq_sign'],[c-b,'eq_noDiv'],[(c-b)*a,'eq_mult']],`${a}x = ${c} − ${b} = ${c-b}, donc x = ${x}`);},
  ()=>{const a=rnd(2,9),x=rnd(4,15),b=rnd(3,25),c=a*x-b;return mk(`${a}x − ${b} = ${c}`,x,'',[[(c-b)/a,'eq_sign'],[c+b,'eq_noDiv'],[(c+b)*a,'eq_mult']],`${a}x = ${c} + ${b} = ${c+b}, donc x = ${x}`);}
 ],
 [ // niveau 4
  ()=>{const a=rnd(2,8),x=rnd(3,15),b=rnd(2,9),c=a*(x+b);return mk(`${a}(x + ${b}) = ${c}`,x,'',[[c/a+b,'eq_sign'],[(c-b)/a,'eq_dist'],[c-b,'eq_dist']],`x + ${b} = ${c} ÷ ${a} = ${c/a}, donc x = ${x}`);},
  ()=>{const c=rnd(2,5),a=c+rnd(2,5),x=rnd(3,15),b=rnd(2,15),d=(a-c)*x+b;return mk(`${a}x + ${b} = ${c}x + ${d}`,x,'',[[(d+b)/(a-c),'eq_side'],[(d-b)/(a+c),'eq_side'],[d-b,'eq_noDiv']],`${a-c}x = ${d} − ${b} = ${d-b}, donc x = ${x}`);}
 ],
 [ // niveau 5
  ()=>{const a=rnd(2,6),c=rnd(2,6),x=rnd(3,14),b=rnd(2,12),d=(a*x+b)/c;if(d!==Math.floor(d))return null;return mk(`(${a}x + ${b}) ÷ ${c} = ${d}`,x,'',[[(d-b)/a,'eq_mult'],[(d*c+b)/a,'eq_sign'],[d*c-b,'eq_noDiv']],`${a}x + ${b} = ${d} × ${c} = ${d*c}, donc x = ${x}`);},
  ()=>{const a=rnd(2,7),x=rnd(3,12),b=rnd(2,9),e=rnd(2,15),r=a*(x-b)+e;return mk(`${a}(x − ${b}) + ${e} = ${r}`,x,'',[[(r-e)/a-b,'eq_sign'],[(r+e)/a+b,'eq_sign'],[(r-e)/a,'eq_dist']],`${a}(x − ${b}) = ${r-e}, x − ${b} = ${(r-e)/a}, donc x = ${x}`);},
  ()=>{const c=rnd(2,5),a=c+rnd(2,6),x=rnd(-12,-2),b=rnd(5,30),d=(a-c)*x+b;return mk(`${a}x + ${b} = ${c}x + ${d}`.replace('+ -','− '),x,'',[[-x,'eq_sign'],[(d-b)/(a+c),'eq_side'],[d-b,'eq_noDiv']],`${a-c}x = ${d} − ${b} = ${d-b}, donc x = ${x}`);}
 ]
];

/* ---- POURCENTAGES ---- */
GEN.POURCENTAGES=[
 [ // niveau 1 : p % de n (10, 25, 50...)
  ()=>{const p=pick([10,50,25,20]),n=pick([20,40,60,80,100,120,200,400]),a=p*n/100;return mk(`${p} % de ${n} = ?`,a,'',[[p*n,'pct_noDiv'],[p*n/10,'pct_div10'],[n-a,'pct_wrongDir']],`${p} % de ${n} = ${n} × ${p} ÷ 100 = ${fmt(a)}`);}
 ],
 [ // niveau 2
  ()=>{const p=pick([5,15,30,40,60,75,80]),n=20*rnd(2,15),a=p*n/100;return mk(`${p} % de ${n} = ?`,a,'',[[p*n,'pct_noDiv'],[p*n/10,'pct_div10'],[n-a,'pct_wrongDir']],`${p} % de ${n} = ${n} × ${p} ÷ 100 = ${fmt(a)}`);},
  ()=>{const p=pick([10,20,25,50]),a=rnd(3,30)*(p===25?4:p===20?5:10)*p/100;const n=a*100/p;return mk(`${p} % de ${fmt(n)} = ?`,a,'',[[n*p,'pct_noDiv'],[n*p/10,'pct_div10']],`${fmt(n)} × ${p} ÷ 100 = ${fmt(a)}`);}
 ],
 [ // niveau 3 : prix après remise / hausse
  ()=>{const n=10*rnd(3,20),p=pick([10,20,25,30,40,50]),m=n*p/100,r=n-m;return mk(`Un article coûte ${n} €.\nRemise de ${p} %. Nouveau prix ?`,r,'€',[[m,'pct_amount'],[n+m,'pct_wrongDir'],[n-p,'pct_subP']],`Remise : ${n} × ${p} ÷ 100 = ${fmt(m)} €. Prix : ${n} − ${fmt(m)} = ${fmt(r)} €`);},
  ()=>{const n=10*rnd(3,20),p=pick([10,20,25,30,50]),m=n*p/100,r=n+m;return mk(`Un article coûte ${n} €.\nHausse de ${p} %. Nouveau prix ?`,r,'€',[[m,'pct_amount'],[n-m,'pct_wrongDir'],[n+p,'pct_subP']],`Hausse : ${n} × ${p} ÷ 100 = ${fmt(m)} €. Prix : ${n} + ${fmt(m)} = ${fmt(r)} €`);}
 ],
 [ // niveau 4 : taux d'évolution, TVA
  ()=>{const A=20*rnd(3,15),p=pick([5,10,15,20,25,50]),up=Math.random()<.6,B=A*(1+(up?1:-1)*p/100);if(B!==Math.round(B*100)/100)return null;
    return mk(`Un prix passe de ${A} € à ${fmt(B)} €.\nTaux de ${up?'hausse':'baisse'} en % ?`,p,'%',[[Math.abs(B-A),'pct_diff'],[Math.round(100*Math.abs(B-A)/B),'pct_badBase'],[Math.round(100*B/A),'pct_ratio']],`(${fmt(Math.max(A,B))} − ${fmt(Math.min(A,B))}) ÷ ${A} = ${fmt(Math.abs(B-A)/A)} = ${p} %`);},
  ()=>{const h=10*rnd(5,40),t=h*0.2;return mk(`Prix HT : ${h} €. TVA : 20 %.\nPrix TTC ?`,h+t,'€',[[t,'pct_amount'],[h+20,'tva_add'],[h*1.2*1.2,'tva_add']],`TVA : ${h} × 0,2 = ${fmt(t)} €. TTC : ${h} + ${fmt(t)} = ${fmt(h+t)} €`);}
 ],
 [ // niveau 5 : retrouver la valeur de départ
  ()=>{const n=20*rnd(3,25),p=pick([5,10,20,25,50]),X=n*(1+p/100);return mk(`Après une hausse de ${p} %, un prix vaut ${fmt(X)} €.\nPrix de départ ?`,n,'€',[[X*(1-p/100),'pct_noRev'],[X-p,'pct_subP'],[X*p/100,'pct_amount']],`${fmt(X)} ÷ ${fmt(1+p/100)} = ${n} €`);},
  ()=>{const h=25*rnd(2,24),T=h*1.2;return mk(`Un article coûte ${fmt(T)} € TTC (TVA 20 %).\nPrix HT ?`,h,'€',[[T*0.8,'tva_dir'],[T-20,'pct_subP'],[T*0.2,'pct_amount']],`${fmt(T)} ÷ 1,2 = ${h} €`);},
  ()=>{const n=20*rnd(3,25),p=pick([10,20,25,50]),X=n*(1-p/100);return mk(`Après une baisse de ${p} %, un prix vaut ${fmt(X)} €.\nPrix de départ ?`,n,'€',[[X*(1+p/100),'pct_noRev'],[X+p,'pct_subP'],[X*p/100,'pct_amount']],`${fmt(X)} ÷ ${fmt(1-p/100)} = ${n} €`);}
 ]
];

/* ---- CALCUL MENTAL ---- */
function offs(a){return[[a+10,'off1'],[a-10,'off1'],[a+1,'off1'],[a-1,'off1']];}
GEN.CALCUL_MENTAL=[
 [ // niveau 1
  ()=>{const a=rnd(8,45),b=rnd(6,40);return mk(`${a} + ${b} = ?`,a+b,'',offs(a+b),`${a} + ${b} = ${a+b}`);},
  ()=>{const b=rnd(6,35),a=b+rnd(8,40);return mk(`${a} − ${b} = ?`,a-b,'',offs(a-b),`${a} − ${b} = ${a-b}`);},
  ()=>{const a=rnd(2,5),b=rnd(3,9);return mk(`${a} × ${b} = ?`,a*b,'',[[a*b+a,'near'],[a*b-a,'near'],[a+b,'sq_double'],[a*b+b,'near']],`${a} × ${b} = ${a*b}`);}
 ],
 [ // niveau 2
  ()=>{const a=rnd(27,69),b=rnd(15,49);return mk(`${a} + ${b} = ?`,a+b,'',offs(a+b),`${a} + ${b} = ${a+b}`);},
  ()=>{const a=rnd(6,9),b=rnd(6,9);return mk(`${a} × ${b} = ?`,a*b,'',[[a*b+a,'near'],[a*b-a,'near'],[a*b+b,'near'],[a*b-b,'near']],`${a} × ${b} = ${a*b}`);},
  ()=>{const a=rnd(12,98);return mk(`Le double de ${a} = ?`,2*a,'',[[a+2,'near'],[2*a+10,'off1'],[2*a-10,'off1']],`${a} × 2 = ${2*a}`);},
  ()=>{const a=2*rnd(14,60);return mk(`La moitié de ${a} = ?`,a/2,'',[[a*2,'eq_mult'],[a/2+10,'off1'],[a/2-10,'off1'],[a-2,'near']],`${a} ÷ 2 = ${a/2}`);}
 ],

/* ---- Fabrication des 4 réponses (1 bonne + 3 fausses plausibles, distinctes) ---- */
function r2(v){return Math.round(v*100)/100;}
function decs(v){const s=String(r2(v));const i=s.indexOf('.');return i<0?0:s.length-i-1;}
function buildChoices(q){
  const A=q.ans,intOnly=(q.chap==='EQUATION'||q.chap==='CALCUL_MENTAL'||q.chap==='CARRE');
  const seen=new Set([A]);const out=[];const usedWhy=new Set();
  function ok(v){
    if(!isFinite(v))return false;v=r2(v);
    if(seen.has(v))return false;
    if(intOnly&&!Number.isInteger(v))return false;
    if(decs(v)>2)return false;
    if(A>=0&&v<0&&!(q.chap==='EQUATION'&&q.level>=5))return false;
    const lim=q.chap==='CONVERSIONS'?1000:25;
    if(Math.abs(v)>(q.chap==='CONVERSIONS'?60000:9999999))return false;
    if(A!==0&&v!==0&&(Math.abs(v)>Math.abs(A)*lim||Math.abs(v)<Math.abs(A)/lim))return false;
    if(A>=1&&v===0)return false;
    return true;
  }
  const cand=shuffle(q.wrongs.filter(w=>w&&w[1]!=='near'));
  const take=(v,why)=>{v=r2(v);seen.add(v);out.push({v:v,why:why});usedWhy.add(why);};
  cand.forEach(w=>{if(out.length<3&&ok(w[0])&&!usedWhy.has(w[1]))take(w[0],w[1]);});
  cand.forEach(w=>{if(out.length<3&&ok(w[0]))take(w[0],w[1]);});
  if(out.length<3){
    const steps=intOnly||Number.isInteger(A)?[1,2,10,5,20]:[0.5,1,2,0.1,10];
    const g=[];steps.forEach(s=>{g.push(A+s,A-s);});
    shuffle(g).forEach(v=>{if(out.length<3&&ok(v))take(v,Math.abs(v-A)>=10?'off1':'near');});
  }
  if(out.length<3){for(let k=1;k<60&&out.length<3;k++){if(ok(A+k))take(A+k,'near');if(out.length<3&&ok(A-k))take(A-k,'near');}}
  return out.length===3?out:null;
}

/* ---- Tirage d’une question : variété + mémoire anti-répétition ---- */
const recentSig=[];
function makeQuestion(chapSel,level){
  const ids=CHAPS.map(c=>c.id);
  for(let t=0;t<60;t++){
    const chap=Array.isArray(chapSel)?pick(chapSel):(chapSel==='TOUS'?pick(ids):chapSel);
    let lv=clamp(level,1,5);if(lv>2&&Math.random()<0.22)lv--;
    const f=pick(GEN[chap][lv-1]);let q=null;
    try{q=f();}catch(e){q=null;}
    if(!q)continue;
    const sig=chap+'|'+q.text;
    if(t<50&&recentSig.indexOf(sig)>=0)continue;
    q.chap=chap;q.level=lv;q.sig=sig;
    const ch=buildChoices(q);if(!ch)continue;
    const all=ch.concat([{v:q.ans,why:null}]);
    q.choices=shuffle(all).map(c=>({v:c.v,ok:c.why===null,why:c.why}));
    recentSig.push(sig);if(recentSig.length>45)recentSig.shift();
    return q;
  }
  return {chap:'CALCUL_MENTAL',level:1,text:'7 × 8 = ?',ans:56,unit:'',sol:'7 × 8 = 56',sig:'fb',choices:shuffle([{v:56,ok:true},{v:54,ok:false,why:'near'},{v:48,ok:false,why:'near'},{v:63,ok:false,why:'near'}])};
}

    tRow0=r0+3;const rowsAvail=ROWS-1-tRow0;

    const rg=clamp(Math.floor((rowsAvail-3*th)/2),2,4);
    const totW=3*tw+2*gap,tx0=innerL+Math.max(0,Math.floor((innerW-totW)/2));
    for(let j=0;j<3;j++)for(let i=0;i<3;i++)L.tables.push({x:tx0+i*(tw+gap),y:tRow0+j*(th+rg),w:tw,h:th});
    totH=3*th+2*rg;
    L.furn=[{x:1,y:tRow0,w:fw,h:totH,side:'L'},{x:COLS-1-fw,y:tRow0,w:fw,h:totH,side:'R'}];
  }
  L.tw=tw;L.th=th;
  const mark=r=>{for(let y=r.y;y<r.y+r.h;y++)for(let x=r.x;x<r.x+r.w;x++)if(x>=0&&x<COLS&&y>=0&&y<ROWS)L.blk[y*COLS+x]=1;};
  L.tables.forEach(mark);L.furn.forEach(mark);mark(L.prof);
  // élèves : un banc de 2 élèves par table (tw cases) — apparence fixe par graine
  L.tables.forEach((t,ti)=>{
    const n=t.w>=5?2:1;
    for(let k=0;k<n;k++)L.students.push({t:ti,k:k,n:n,seed:(ti*7+k*3+1)});
  });
  // tableau : rectangle en pixels
  L.board=MOB?{x:CELL*0.4,y:tbRows*CELL+CELL*0.25,w:(COLS-0.8)*CELL,h:bdRows*CELL-CELL*0.35}
            :{x:2*CELL,y:tbRows*CELL+CELL*0.25,w:(COLS-4)*CELL,h:bdRows*CELL-CELL*0.35};
  computeSafeBlocks();
}
const inRect=(r,x,y)=>x>=r.x&&x<r.x+r.w&&y>=r.y&&y<r.y+r.h;
const isSolid=(x,y)=>L.blk[y*COLS+x]===1;
function bubbleOn(x,y){return R&&R.bubbleT>0&&inRect(L.bubble,x,y);}

/* BFS (avec wrap horizontal + vertical dans la zone jouable) */
function wrapCell(x,y){if(x<0)x=COLS-1;else if(x>=COLS)x=0;if(y<r0)y=ROWS-1;else if(y>=ROWS)y=r0;return{x:x,y:y};}
function bfsDist(sx,sy){
  const d=new Int16Array(COLS*ROWS).fill(-1);const q=[sx+sy*COLS];d[sx+sy*COLS]=0;
  for(let h=0;h<q.length;h++){const c=q[h],cx=c%COLS,cy=(c/COLS)|0;
    for(const dd of DIRS){const n=wrapCell(cx+dd.x,cy+dd.y);const k=n.x+n.y*COLS;
      if(d[k]<0&&!isSolid(n.x,n.y)&&!inRect(L.bubble,n.x,n.y)){d[k]=d[c]+1;q.push(k);}}}
  return d;
}
/* Positions de secours précalculées : 4 blocs 2×2 bien répartis (échantillonnage du plus éloigné) */
function blockFree(x,y,occ){
  if(x<1||y<r0||x+1>COLS-2||y+1>ROWS-1)return false;
  for(let j=0;j<2;j++)for(let i=0;i<2;i++){const k=(x+i)+(y+j)*COLS;if(L.blk[k]||(occ&&occ[k]))return false;if(inRect(L.bubble,x+i,y+j))return false;}
  return true;
}
function computeSafeBlocks(){
  const all=[];
  for(let y=r0;y<ROWS-1;y++)for(let x=1;x<COLS-2;x++)if(blockFree(x,y,null))all.push({x:x,y:y});
  const out=[];
  if(all.length){
    out.push(all[Math.floor(all.length/2)]);
    while(out.length<8&&out.length<all.length){
      let best=null,bd=-1;
      for(const c of all){if(out.some(o=>Math.max(Math.abs(c.x-o.x),Math.abs(c.y-o.y))<2))continue;let m=1e9;for(const o of out)m=Math.min(m,Math.abs(c.x-o.x)+Math.abs(c.y-o.y));if(m>bd){bd=m;best=c;}}
      if(!best)break;out.push(best);
    }
  }
  L.safe=out;
}

/* Apparition robuste des réponses : strict → progressivement relâché → secours */
const ANS_COLORS=['#ff6b6b','#4dabf7','#51cf66','#b197fc'];
function spawnAnswers(q){
  const head=R.snake[0];
  const occ=new Uint8Array(COLS*ROWS);
  R.snake.forEach(s=>{occ[s.x+s.y*COLS]=1;});
  const dist=bfsDist(head.x,head.y);
  const levels=[{pad:1,mh:8,sep:8},{pad:1,mh:6,sep:6},{pad:1,mh:5,sep:5},{pad:0,mh:4,sep:4},{pad:0,mh:3,sep:3},{pad:0,mh:2,sep:2}];
  const midX=COLS/2,midY=(r0+ROWS)/2;
  const cand=[];
  for(let y=r0;y<ROWS-1;y++)for(let x=1;x<COLS-2;x++){
    if(!blockFree(x,y,occ))continue;
    const d=dist[x+y*COLS];if(d<0)continue;
    cand.push({x:x,y:y,d:d,z:(x+1<midX?0:1)+(y+1<midY?0:2)});
  }
  const ci=q.choices.findIndex(c=>c.ok);
  const reachWith=(tg,wrongs)=>{ // la case cible est-elle atteignable si les « wrongs » sont des obstacles ?
    const wr=new Uint8Array(COLS*ROWS);
    wrongs.forEach(b=>{for(let j=0;j<2;j++)for(let k=0;k<2;k++)wr[(b.x+k)+(b.y+j)*COLS]=1;});
    const d=new Uint8Array(COLS*ROWS),qq=[head.x+head.y*COLS];d[qq[0]]=1;
    for(let h=0;h<qq.length;h++){const cc=qq[h],cx=cc%COLS,cy=(cc/COLS)|0;
      if(cx>=tg.x&&cx<tg.x+2&&cy>=tg.y&&cy<tg.y+2)return true;
      for(const dd of DIRS){const n=wrapCell(cx+dd.x,cy+dd.y),kk=n.x+n.y*COLS;
        if(!d[kk]&&!isSolid(n.x,n.y)&&!wr[kk]&&!inRect(L.bubble,n.x,n.y)&&!occ[kk]){d[kk]=1;qq.push(kk);}}}
    return false;
  };
  const accept=pk=>{ // la bonne réponse doit rester atteignable même si les 3 autres bloquent le passage
    if(pk.length<4||ci<0)return true;
    return reachWith(pk[ci],pk.filter((b,i)=>i!==ci));
  };
  let chosen=null;
  for(const lv of levels){
    for(let att=0;att<30&&!chosen;att++){
      const zs=shuffle([0,1,2,3]),pickd=[];let fail=false;
      for(const z of zs){
        const pool=cand.filter(c=>c.z===z&&c.d>=lv.mh&&c.x>=1+lv.pad&&c.x<=COLS-3-lv.pad&&pickd.every(o=>Math.max(Math.abs(o.x-c.x),Math.abs(o.y-c.y))>=Math.min(lv.sep,Math.max(3,lv.sep))));
        if(!pool.length){fail=true;break;}
        pickd.push(pick(pool));
      }
      if(!fail&&accept(pickd))chosen=pickd;
    }
    if(!chosen){ // sans quadrants : tirage glouton
      for(let att=0;att<30&&!chosen;att++){
        const pickd=[];const pool0=shuffle(cand.filter(c=>c.d>=lv.mh));
        for(const c of pool0){if(pickd.length<4&&pickd.every(o=>Math.max(Math.abs(o.x-c.x),Math.abs(o.y-c.y))>=lv.sep))pickd.push(c);}
        if(pickd.length===4&&accept(pickd))chosen=pickd;
      }
    }
    if(chosen)break;
  }
  if(!chosen&&ci>=0){ // construction : on place la bonne réponse, puis seulement des mauvaises qui laissent le passage
    const all=[];for(let y=r0;y<ROWS-1;y++)for(let x=1;x<COLS-2;x++)if(blockFree(x,y,occ)&&!(Math.abs(x-head.x)<2&&Math.abs(y-head.y)<2))all.push({x:x,y:y});
    for(let att=0;att<80&&!chosen;att++){
      const pool=shuffle(all.slice()),corr=pool.find(c=>dist[c.x+c.y*COLS]>=2);if(!corr)continue;
      const pk=[corr],wrongs=[];
      for(const c of pool){if(wrongs.length>=3)break;if(c===corr)continue;
        if(Math.max(Math.abs(c.x-corr.x),Math.abs(c.y-corr.y))<2||!wrongs.every(o=>Math.max(Math.abs(o.x-c.x),Math.abs(o.y-c.y))>=2))continue;
        if(reachWith(corr,wrongs.concat([c])))wrongs.push(c);}
      if(wrongs.length===3){const arr=new Array(4);arr[ci]=corr;let j=0;for(let i=0;i<4;i++)if(i!==ci)arr[i]=wrongs[j++];chosen=arr;}
    }
  }
  if(!chosen){ // dernier recours : toutes les places libres (hors serpent), sans chevauchement, accessibles si possible
    const all=[];for(let y=r0;y<ROWS-1;y++)for(let x=1;x<COLS-2;x++)if(blockFree(x,y,occ)&&!(Math.abs(x-head.x)<2&&Math.abs(y-head.y)<2))all.push({x:x,y:y});
    let best=null;
    for(let att=0;att<60&&!(best&&best.ok);att++){
      const pk=[];for(const c of shuffle(all.slice())){if(pk.length<4&&pk.every(o=>Math.max(Math.abs(o.x-c.x),Math.abs(o.y-c.y))>=2))pk.push(c);}
      if(pk.length===4){const ok=accept(pk);if(!best||ok)best={pk:pk,ok:ok};}
    }
    if(best)chosen=best.pk;
  }
  if(!chosen){ // secours : blocs précalculés
    let fb=null;for(let t=0;t<40;t++){const f=shuffle(L.safe.filter(s=>!(Math.abs(s.x-head.x)<3&&Math.abs(s.y-head.y)<3)));fb=f;if(f.length>=4&&accept(f.slice(0,4)))break;}
    chosen=fb.slice(0,4);
    let k=0;while(chosen.length<4&&L.safe.length){chosen.push(L.safe[k%L.safe.length]);k++;if(k>16)break;}
    while(chosen.length<4)chosen.push({x:1+chosen.length*2,y:r0+3});
  }
  const cols=shuffle(ANS_COLORS);
  R.answers=chosen.slice(0,4).map((c,i)=>({x:c.x,y:c.y,w:2,h:2,v:q.choices[i].v,ok:q.choices[i].ok,why:q.choices[i].why,color:cols[i],age:0,seed:Math.random()*6.28}));
  if(R.answers.length!==4)throw new Error('answers!=4');
}

/* =========================================================
   3. ÉTAT, PARTIE, MÉCANIQUE DU SERPENT
   ========================================================= */
const ALL_CH=CHAPS.map(c=>c.id);
const DEF={name:'',klass:'',chaps:ALL_CH.slice(),chrono:30,diff:1,tick:150,lives:3,mute:false,report:{stats:true,qa:true,errors:true,review:true,howto:true}};
const S={histN:0,screen:'fs',from:'menu1',set:Object.assign({},DEF,store.get('settings',{})||{}),best:Number(store.get('best',0))||0,t:0,err:'',focus:null,hover:null,scrollY:0,scrollMax:0,confirmClear:0,msg:'',msgT:0};
function sanitizeSettings(){const s=S.set;

  s.tick=clamp(Math.round(+s.tick||150),20,350);s.lives=clamp(Math.round(+s.lives||3),1,5);

  if(s.chap&&CHAP_BY_ID[s.chap]&&!Array.isArray(s.chaps))s.chaps=[s.chap];delete s.chap;
  s.chaps=(Array.isArray(s.chaps)?s.chaps:[]).filter(k=>CHAP_BY_ID[k]);if(!s.chaps.length)s.chaps=ALL_CH.slice();
  const rp=Object.assign({},DEF.report,(s.report&&typeof s.report==='object')?s.report:{});Object.keys(DEF.report).forEach(k=>{rp[k]=!!rp[k];});s.report=rp;

sanitizeSettings();
function chapLabel(){const c=S.set.chaps;return c.length===ALL_CH.length?'Tous':(c.length===1?CHAP_BY_ID[c[0]].label:c.length+' chapitres');}
function saveSettings(){store.set('settings',S.set);}
let R=null;

function cellPx(x,y){return{x:x*CELL+CELL/2,y:y*CELL+CELL/2};}
function emit(px,py,color,n,spd,life,size){
  for(let i=0;i<n;i++){const a=Math.random()*6.283,v=(0.3+Math.random())*spd;
    R.particles.push({x:px,y:py,vx:Math.cos(a)*v,vy:Math.sin(a)*v-spd*0.3,life:life*(0.6+Math.random()*0.6),max:life,color:color,size:size*(0.6+Math.random()*0.8)});}
  if(R.particles.length>260)R.particles.splice(0,R.particles.length-260);
}
function floater(px,py,text,color){R.floats.push({x:px,y:py,text:text,color:color,t:0});}

function newRun(){
  const s=S.set,hx=Math.floor(COLS/2),hy=ROWS-1;
  R={snake:[{x:hx,y:hy,c:0},{x:hx-1,y:hy,c:1},{x:hx-2,y:hy,c:2}],cc:3,prev:null,dir:{x:1,y:0},queue:[],answers:[],q:null,
     score:0,lives:s.lives,maxLives:s.lives,wrongStreak:0,streak:0,bestStreak:0,diff:s.diff,goodCount:0,timeLeft:s.chrono,pen:0,spd:1,profT:0,badFlash:0,badN:0,bubbleBad:false,speedMult:1,
     acc:0,t:0,bubbleT:0,log:[],start:new Date(),qStart:0,stuck:0,pend:0,particles:[],floats:[],shake:0,bump:0,
     cheat:{show:0,used:[],buf:''},over:null,qi:0,corr:null,hand:0,pace:0};
  R.prev=R.snake.map(c=>({x:c.x,y:c.y,c:c.c}));
  let free=0;for(let i=0;i<L.blk.length;i++)if(!L.blk[i])free++;
  R.maxLen=MOB?clamp(Math.round(free*0.05),7,14):clamp(Math.round(free*0.055),10,20); // longueur maximale : évite que le serpent s’emprisonne lui-même
  nextQuestion();
}
function nextQuestion(){
  R.q=makeQuestion(S.set.chaps,R.diff);
  R.timeLeft=S.set.chrono;R.qStart=R.t;R.qi++;
  spawnAnswers(R.q);SFX.pop();
}
function tickMsEff(){return clamp(S.set.tick/(R.spd*R.speedMult),20,600);}

function pushDir(d){
  if(!R)return;const last=R.queue.length?R.queue[R.queue.length-1]:R.dir;
  if(sameDir(d,last)||oppDir(d,last))return;
  if(R.queue.length<2)R.queue.push(d);
}
function bodyHit(x,y,growing){
  const n=R.snake.length-(growing?0:1);
  for(let i=0;i<n;i++)if(R.snake[i].x===x&&R.snake[i].y===y)return true;
  return false;
}
function cellOK(x,y){const h0=R.snake[0];return !isSolid(x,y)&&(!bubbleOn(x,y)||bubbleOn(h0.x,h0.y))&&!bodyHit(x,y,R.pend>0);}
/* espace libre accessible depuis une case (plafonné) : sert au rebond intelligent */
function spaceFrom(sx,sy,cap){
  const seen=new Set([sx+sy*COLS]),q=[[sx,sy]];
  for(let h=0;h<q.length&&seen.size<cap;h++){
    for(const d of DIRS){const n=wrapCell(q[h][0]+d.x,q[h][1]+d.y),k=n.x+n.y*COLS;
      if(!seen.has(k)&&cellOK(n.x,n.y)){seen.add(k);q.push([n.x,n.y]);}}
  }
  return seen.size;
}
function moveTo(n,d){
  R.snake.unshift({x:n.x,y:n.y,c:R.cc++});
  if(R.pend>0)R.pend--;else R.snake.pop();
  R.dir=d;
}
function tickStep(){
  R.prev=R.snake.map(c=>({x:c.x,y:c.y,c:c.c}));
  const head=R.snake[0];
  let want=R.queue.length?R.queue.shift():R.dir;
  let n=wrapCell(head.x+want.x,head.y+want.y);
  if(cellOK(n.x,n.y)){moveTo(n,want);R.stuck=0;}
  else{ // rebond intelligent : meilleure direction alternative (jamais demi-tour)
    let best=null,bs=-1;
    for(const d of shuffle(DIRS)){
      if(oppDir(d,R.dir)||sameDir(d,want))continue;
      const m=wrapCell(head.x+d.x,head.y+d.y);if(!cellOK(m.x,m.y))continue;
      const sp=spaceFrom(m.x,m.y,70)+(sameDir(d,R.dir)?3:0);
      if(sp>bs){bs=sp;best={d:d,m:m};}
    }
    if(!best){ // pas d’issue : on tolère la bulle du prof (elle ne doit jamais emprisonner le serpent)
      for(const d of shuffle(DIRS)){
        if(oppDir(d,R.dir))continue;
        const m=wrapCell(head.x+d.x,head.y+d.y);if(isSolid(m.x,m.y)||bodyHit(m.x,m.y,R.pend>0))continue;
        best={d:d,m:m};break;
      }
    }
    R.queue=[];
    if(best){moveTo(best.m,best.d);R.bump=0.3;R.stuck=0;SFX.bump();R.pace=0;}
    else{R.stuck++;if(R.stuck>=2){
      if(MOB&&R.snake.length>3){ // mobile : le serpent coincé se raccourcit au lieu de terminer la partie
        const hp=cellPx(head.x,head.y);emit(hp.x,hp.y,'#ffd43b',18,CELL*6,0.7,CELL*0.18);floater(hp.x,hp.y-CELL,'Coincé : raccourci !','#e8590c');
        R.snake=R.snake.slice(0,3);R.prev=R.snake.map(c=>({x:c.x,y:c.y,c:c.c}));R.pend=0;R.stuck=0;R.queue=[];return;
      }
      logAttempt('bloqué','—',0);endGame('Snake bloqué : plus aucun déplacement possible');return;}}
  }
  checkPick();
}
function checkPick(){
  const h=R.snake[0];
  for(const a of R.answers){
    if(a.age>=0.8&&h.x>=a.x&&h.x<a.x+a.w&&h.y>=a.y&&h.y<a.y+a.h){pickAnswer(a);return;}
  }
}
function cheatFlags(){return Array.from(new Set(R.cheat.used)).join(' ');}
function logAttempt(res,chosen,sec,why){
  const q=R.q;
  R.log.push({n:R.log.length+1,chap:q.chap,level:q.level,text:q.text,correct:fmt(q.ans)+(q.unit?' '+q.unit:''),chosen:chosen===null||chosen==='—'?'—':fmt(chosen)+(q.unit?' '+q.unit:''),res:res,sec:Math.round(sec*10)/10,cheats:cheatFlags(),why:why||null,sol:q.sol||''});
}
function pickAnswer(a){
  const q=R.q,sec=Math.max(0,R.t-R.qStart),c=cellPx(a.x+0.5,a.y+0.5);
  if(a.ok){
    logAttempt('bon',a.v,sec);
    R.score++;R.streak++;R.bestStreak=Math.max(R.bestStreak,R.streak);R.goodCount++;R.wrongStreak=0;if(R.snake.length+R.pend<R.maxLen)R.pend++;R.bubbleT=2;R.bubbleBad=false;R.hand=2.2;R.corr=null;R.spd=Math.min(2.2,R.spd*1.045);
    SFX.good();emit(c.x,c.y,a.color,26,CELL*9,0.9,CELL*0.22);emit(c.x,c.y,'#ffd43b',14,CELL*6,0.8,CELL*0.18);
    floater(c.x,c.y-CELL,'+1'+(R.streak>=3?'  🔥'+R.streak:''),'#2f9e5b');
    if(R.goodCount%5===0&&R.diff<5){R.diff++;SFX.level();floater(W/2,H*0.5,'Niveau '+R.diff+' !','#6c7bff');}
    if(R.score>S.best){S.best=R.score;store.set('best',S.best);}
    nextQuestion();
  }else{
    logAttempt('faux',a.v,sec,a.why);
    SFX.bad();emit(c.x,c.y,'#ff6b6b',22,CELL*8,0.8,CELL*0.2);R.shake=0.45;
    R.lives--;R.wrongStreak++;R.streak=0;R.spd=Math.max(0.55,R.spd*0.86);R.profT=1.3;R.badN++;R.bubbleT=1.8;R.bubbleBad=true;R.badFlash=1.6;R.hand=0;
    if(R.snake.length>3&&R.pend===0)R.snake.pop();
    floater(c.x,c.y-CELL,'−1 ❤','#e03131');
    R.corr={q:q,chosen:a.v,why:a.why,t:6};
    if(R.lives<=0){endGame('Plus de vies');return;}
    if(R.wrongStreak>=3){endGame('3 erreurs de suite');return;}
    nextQuestion();
  }
}
function onTimeout(){
  const q=R.q;logAttempt('timeout','—',S.set.chrono);
  R.corr={q:q,chosen:null,why:null,t:6};

}
function endGame(reason){

}
function runToGame(r){return{date:r.start.toISOString(),name:S.set.name,klass:S.set.klass,chaps:S.set.chaps.slice(),diff:r.diff,score:r.score,over:r.over||'',log:r.log.slice(0,200)};}
function saveHistory(){ // historique local (40 parties max) : sert au rapport cumulé
  try{if(R.saved)return;R.saved=true;const h=store.get('history',[]);const a=Array.isArray(h)?h:[];a.push(runToGame(R));while(a.length>40)a.shift();store.set('history',a);}catch(e){}
}
function bilan(){
  const rows={},mk0=()=>({bon:0,faux:0,timeout:0,'bloqué':0,tot:0,sec:0,nsec:0});
  const g=mk0();
  R.log.forEach(r=>{const o=rows[r.chap]||(rows[r.chap]=mk0());[o,g].forEach(x=>{x[r.res]++;x.tot++;if(r.res==='bon'||r.res==='faux'){x.sec+=r.sec;x.nsec++;}});});
  const fin=o=>{o.pct=o.tot?Math.round(100*o.bon/o.tot):0;o.avg=o.nsec?Math.round(10*o.sec/o.nsec)/10:0;return o;};
  Object.keys(rows).forEach(k=>fin(rows[k]));fin(g);
  return{rows:rows,g:g};
}
function relayoutRun(){ // après un redimensionnement qui change la grille
  if(!R||R.over)return;
  const hx=Math.floor(COLS/2),hy=ROWS-1,len=Math.max(3,R.snake.length);
  R.snake=[];for(let i=0;i<len;i++)R.snake.push({x:(hx-i+COLS)%COLS,y:hy,c:len-i});
  R.prev=R.snake.map(c=>({x:c.x,y:c.y}));R.dir={x:1,y:0};R.queue=[];R.pend=0;R.bubbleT=0;
  spawnAnswers(R.q);
}
function startGame(){
  SFX.unlock();saveSettings();newRun();S.screen='play';
}

/* Mise à jour par image */
function update(dt){
  S.t+=dt;if(S.msgT>0)S.msgT-=dt;
  if(!R)return;
  R.particles.forEach(p=>{p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=CELL*14*dt;});
  R.particles=R.particles.filter(p=>p.life>0);
  R.floats.forEach(f=>{f.t+=dt;});R.floats=R.floats.filter(f=>f.t<1.4);
  if(R.shake>0)R.shake=Math.max(0,R.shake-dt);
  if(R.bump>0)R.bump=Math.max(0,R.bump-dt);
  if(S.screen==='end'){R.endT=(R.endT||0)+dt;return;}
  if(S.screen!=='play')return;
  R.t+=dt;R.pace+=dt;
  R.answers.forEach(a=>{a.age+=dt;});
  if(R.bubbleT>0)R.bubbleT-=dt;
  if(R.hand>0)R.hand-=dt;
  if(R.profT>0)R.profT-=dt;
  if(R.badFlash>0)R.badFlash-=dt;
  if(R.corr){R.corr.t-=dt;if(R.corr.t<=0)R.corr=null;}
  if(R.cheat.show>0)R.cheat.show-=dt;
  const before=Math.ceil(R.timeLeft);R.timeLeft-=dt;
  if(R.timeLeft<=5&&Math.ceil(R.timeLeft)<before&&R.timeLeft>0)SFX.tick();
  if(R.timeLeft<=0){R.timeLeft=0;onTimeout();return;}
  const tm=tickMsEff();R.acc+=dt*1000;
  let guard=0;
  while(R.acc>=tm&&S.screen==='play'&&guard++<4){R.acc-=tm;tickStep();}
  if(R.acc>tm*2)R.acc=0;
}

/* =========================================================
   4. DESSIN (1/2) : la salle de classe
   Décor statique mis en cache ; élèves, prof, bulle et tableau dynamiques.
   ========================================================= */
function rr(c,x,y,w,h,r){r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
function shade(hex,k){ // k>0 éclaircit, k<0 assombrit
  const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const f=k>=0?(v=>Math.round(v+(255-v)*k)):(v=>Math.round(v*(1+k)));
  return'rgb('+f(r)+','+f(g)+','+f(b)+')';
}
let bg=null;
function srand(seed){let s=seed*9301+49297;return()=>{s=(s*9301+49297)%233280;return s/233280;};}

function buildBg(){
  bg=document.createElement('canvas');bg.width=Math.round(W*DPR);bg.height=Math.round(H*DPR);
  const c=bg.getContext('2d');c.setTransform(DPR,0,0,DPR,0,0);
  const rnd2=srand(7);
  const yWall=tbRows*CELL,yFloor=r0*CELL;
  // mur
  c.fillStyle='#e6f3ee';c.fillRect(0,yWall,W,yFloor-yWall);
  c.fillStyle='rgba(60,120,100,0.07)';for(let x=0;x<W;x+=CELL*2)c.fillRect(x,yWall,CELL,yFloor-yWall);
  // plinthe
  c.fillStyle='#b98a5a';c.fillRect(0,yFloor-CELL*0.28,W,CELL*0.28);
  c.fillStyle='rgba(255,255,255,0.35)';c.fillRect(0,yFloor-CELL*0.28,W,2);
  // parquet : lattes verticales alternées avec joints décalés
  const pw=Math.max(10,CELL*0.62);let i=0;
  for(let x=0;x<W+pw;x+=pw,i++){
    c.fillStyle=i%2?'#efd9b4':'#e6c996';c.fillRect(x,yFloor,pw,H-yFloor);
    c.fillStyle='rgba(120,80,30,0.16)';c.fillRect(x,yFloor,1.2,H-yFloor);
    const jh=CELL*(2.2+(i%5)*0.35);let off=(i*37)%Math.round(jh);
    for(let y=yFloor-off;y<H;y+=jh){if(y>yFloor){c.fillStyle='rgba(120,80,30,0.14)';c.fillRect(x,y,pw,1.2);}}
    for(let k=0;k<4;k++){c.fillStyle='rgba(150,100,40,0.07)';c.fillRect(x+rnd2()*pw*0.8,yFloor+rnd2()*(H-yFloor),pw*0.15,CELL*(0.4+rnd2()*1.2));}
  }
  // ombre portée du mur sur le sol
  const gr=c.createLinearGradient(0,yFloor,0,yFloor+CELL*0.9);gr.addColorStop(0,'rgba(60,40,20,0.22)');gr.addColorStop(1,'rgba(60,40,20,0)');
  c.fillStyle=gr;c.fillRect(0,yFloor,W,CELL*0.9);
  // tapis sous le prof
  const P=L.prof;c.fillStyle='rgba(108,123,255,0.20)';rr(c,(P.x-1.2)*CELL,(P.y-0.1)*CELL,(P.w+2.4)*CELL,(P.h+1.2)*CELL,CELL*0.4);c.fill();
  c.strokeStyle='rgba(108,123,255,0.35)';c.lineWidth=2;c.setLineDash([CELL*0.3,CELL*0.2]);rr(c,(P.x-0.9)*CELL,(P.y+0.2)*CELL,(P.w+1.8)*CELL,(P.h+0.6)*CELL,CELL*0.3);c.stroke();c.setLineDash([]);
  drawWallDecor(c);
  drawBoardStatic(c);
  L.tables.forEach(t=>drawDeskStatic(c,t));
  L.furn.forEach(f=>drawFurniture(c,f));
}
function drawWallDecor(c){
  const yWall=tbRows*CELL,u=CELL;
  // horloge (à droite du tableau)
  const cx=W-1.0*u,cy=yWall+bdRows*u*0.42,rad=Math.min(u*0.78,bdRows*u*0.3);
  if(W>=640&&!MOB){
    c.fillStyle='#fff';c.strokeStyle='#8b5a2b';c.lineWidth=Math.max(3,u*0.12);c.beginPath();c.arc(cx,cy,rad,0,6.283);c.fill();c.stroke();
    c.strokeStyle='#445';c.lineWidth=2;for(let k=0;k<12;k++){const a=k*Math.PI/6;c.beginPath();c.moveTo(cx+Math.cos(a)*rad*0.8,cy+Math.sin(a)*rad*0.8);c.lineTo(cx+Math.cos(a)*rad*0.92,cy+Math.sin(a)*rad*0.92);c.stroke();}
    c.lineWidth=3;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(-1.2)*rad*0.5,cy+Math.sin(-1.2)*rad*0.5);c.stroke();
    c.lineWidth=2;c.beginPath();c.moveTo(cx,cy);c.lineTo(cx+Math.cos(0.4)*rad*0.7,cy+Math.sin(0.4)*rad*0.7);c.stroke();
    // affiche : règle graduée + équerre à gauche
    const px=0.45*u,pw2=1.1*u,py=yWall+0.3*u,ph=Math.min(bdRows*u*0.7,2.6*u);
    c.fillStyle='#fff3bf';rr(c,px,py,pw2,ph,6);c.fill();c.strokeStyle='#e0b030';c.lineWidth=2;c.stroke();
    c.fillStyle='#e8590c';c.font='bold '+Math.round(u*0.3)+'px system-ui';c.textAlign='center';c.fillText('a² + b²',px+pw2/2,py+ph*0.35);c.fillText('= c²',px+pw2/2,py+ph*0.6);
    c.fillStyle='#2f9e5b';c.font='bold '+Math.round(u*0.2)+'px system-ui';c.fillText('1 m=100 cm',px+pw2/2,py+ph*0.85);
  }
}
function drawBoardStatic(c){
  const B=L.board,fr=Math.max(6,CELL*0.2);
  c.fillStyle='rgba(0,0,0,0.18)';rr(c,B.x+4,B.y+7,B.w,B.h,10);c.fill();
  c.fillStyle='#8b5a2b';rr(c,B.x-fr,B.y-fr,B.w+2*fr,B.h+2*fr,10);c.fill();
  c.fillStyle='#a8723a';rr(c,B.x-fr,B.y-fr,B.w+2*fr,fr*0.7,6);c.fill();
  c.fillStyle='#17573a';rr(c,B.x,B.y,B.w,B.h,5);c.fill();
  const rn=srand(3);
  for(let k=0;k<26;k++){c.fillStyle='rgba(255,255,255,'+(0.025+rn()*0.04)+')';c.beginPath();c.ellipse(B.x+rn()*B.w,B.y+rn()*B.h,B.w*(0.03+rn()*0.08),B.h*(0.02+rn()*0.06),rn()*3,0,6.283);c.fill();}
  // rebord à craies
  c.fillStyle='#6e4520';rr(c,B.x+B.w*0.06,B.y+B.h+fr*0.2,B.w*0.88,fr*0.9,3);c.fill();
  c.fillStyle='#fff';rr(c,B.x+B.w*0.12,B.y+B.h+fr*0.05,CELL*0.7,fr*0.5,2);c.fill();
  c.fillStyle='#ffd43b';rr(c,B.x+B.w*0.12+CELL*0.9,B.y+B.h+fr*0.05,CELL*0.55,fr*0.5,2);c.fill();
  c.fillStyle='#f06595';rr(c,B.x+B.w*0.78,B.y+B.h+fr*0.0,CELL*1.0,fr*0.65,3);c.fill(); // brosse
}
function drawDeskStatic(c,t){
  const x=t.x*CELL,y=t.y*CELL,w=t.w*CELL,h=t.h*CELL,dh=Math.max(CELL*1.05,h*0.52),th=CELL*0.2;
  c.fillStyle='rgba(60,35,10,0.22)';rr(c,x+3,y+6,w,dh+th,10);c.fill();
  c.fillStyle='#8d5a2c';rr(c,x,y+th,w,dh,10);c.fill();           // chant (relief)
  c.fillStyle='#d9a066';rr(c,x,y,w,dh,10);c.fill();               // plateau
  c.fillStyle='rgba(255,255,255,0.22)';rr(c,x+3,y+3,w-6,dh*0.25,6);c.fill();
  c.strokeStyle='rgba(110,70,30,0.35)';c.lineWidth=1.2;
  for(let k=1;k<4;k++){c.beginPath();c.moveTo(x+w*k/4,y+4);c.lineTo(x+w*k/4,y+dh-4);c.stroke();}
  // objets posés : cahiers, trousse, stylo
  const rn=srand(t.x*31+t.y*17),cols=['#4dabf7','#ff6b6b','#51cf66','#ffd43b','#da77f2'];
  const n=t.w>=5?2:1;
  for(let k=0;k<n;k++){
    const cx=x+w*(k+0.5)/n,u=Math.min(CELL*0.9,dh*0.7);
    c.save();c.translate(cx-u*0.35,y+dh*0.5);c.rotate((rn()-0.5)*0.25);
    c.fillStyle=cols[Math.floor(rn()*5)];rr(c,-u*0.45,-u*0.35,u*0.9,u*0.7,3);c.fill();
    c.fillStyle='#fff';rr(c,-u*0.3,-u*0.18,u*0.6,u*0.32,2);c.fill();c.restore();
    c.fillStyle=cols[Math.floor(rn()*5)];rr(c,cx+u*0.28,y+dh*0.3,u*0.55,u*0.24,u*0.12);c.fill();
    c.fillStyle='#f4c430';c.fillRect(cx+u*0.25,y+dh*0.62,u*0.7,u*0.07);
  }
}
function drawFurniture(c,f){
  const x=f.x*CELL,y=f.y*CELL,w=f.w*CELL,h=f.h*CELL;
  c.fillStyle='rgba(50,30,10,0.25)';rr(c,x+4,y+7,w,h,8);c.fill();
  c.fillStyle='#7a4a24';rr(c,x,y,w,h,8);c.fill();
  c.fillStyle='#9a6234';rr(c,x+4,y+4,w-8,h-8,6);c.fill();
  c.fillStyle='rgba(0,0,0,0.20)'; // rayures noires peu opaques
  const sw=Math.max(3,w/6);for(let sx=x+6;sx<x+w-6;sx+=sw*2)c.fillRect(sx,y+6,sw,h-12);
  c.fillStyle='rgba(0,0,0,0.30)';
  const rows=Math.max(3,Math.round(f.h/3));for(let k=1;k<rows;k++)c.fillRect(x+4,y+h*k/rows-2,w-8,4);
  c.fillStyle='rgba(255,255,255,0.18)';c.fillRect(x+6,y+5,w-12,3);
  c.fillStyle='#e9c46a';c.beginPath();c.arc(x+(f.side==='L'?w-8:8),y+h/2,Math.max(3,CELL*0.1),0,6.283);c.fill();
}

/* ---------- Élèves vus de dos, face au tableau ---------- */
const SHIRT=['#ff6b6b','#4dabf7','#fcc419','#69db7c','#da77f2','#ff922b','#38d9a9','#748ffc','#f783ac'];
const HAIR=['#2b1d12','#5a3a22','#c98b3d','#e8c36a','#161616','#8a4b2a','#c0392b','#6b6b6b'];
const SKIN=['#f5c9a0','#e2a97e','#b57b53','#8d5a3b','#f9d9bd'];
function drawStudent(c,t,st,time,raised){
  const x=t.x*CELL,y=t.y*CELL,w=t.w*CELL,h=t.h*CELL,dh=Math.max(CELL*1.05,h*0.52);
  const cx=x+w*(st.k+0.5)/st.n,bot=y+h,u=Math.min(CELL*1.15,(bot-(y+dh)+CELL*0.55)/1.75);
  const sd=st.seed,shirt=SHIRT[sd%SHIRT.length],hair=HAIR[(sd*3)%HAIR.length],skin=SKIN[(sd*5)%SKIN.length],style=(sd*7)%4;
  const sway=Math.sin(time*0.9+sd)*u*0.05,nod=Math.sin(time*0.6+sd*2)>0.96?u*0.05:0;
  // dossier de chaise (devant le dos)
  const torsoTop=bot-u*0.95;
  // bras sur la table
  c.fillStyle=shade(shirt,-0.12);
  rr(c,cx-u*0.95,torsoTop-u*0.35,u*0.38,u*0.9,u*0.19);c.fill();rr(c,cx+u*0.57,torsoTop-u*0.35,u*0.38,u*0.9,u*0.19);c.fill();
  if(raised){ // lève la main
    c.fillStyle=shade(shirt,-0.12);rr(c,cx+u*0.62,torsoTop-u*1.35,u*0.32,u*1.2,u*0.16);c.fill();
    c.fillStyle=skin;c.beginPath();c.arc(cx+u*0.78,torsoTop-u*1.42,u*0.2,0,6.283);c.fill();
  }
  // torse
  c.fillStyle=shirt;rr(c,cx-u*0.85,torsoTop,u*1.7,u*0.95,u*0.4);c.fill();
  c.strokeStyle=shade(shirt,-0.22);c.lineWidth=Math.max(1.5,u*0.05);c.beginPath();c.moveTo(cx,torsoTop+u*0.2);c.lineTo(cx,bot-u*0.15);c.stroke();
  // chaise
  c.fillStyle='#3d4f78';rr(c,cx-u*0.95,bot-u*0.42,u*1.9,u*0.26,u*0.13);c.fill();
  c.fillStyle='rgba(255,255,255,0.22)';rr(c,cx-u*0.85,bot-u*0.4,u*1.7,u*0.07,u*0.04);c.fill();
  // tête (vue de dos)
  const hx=cx+sway,hy=torsoTop-u*0.12+nod,hr=u*0.5;
  if(style===1){c.fillStyle=hair;c.beginPath();c.ellipse(hx+u*0.02,hy+hr*1.05,u*0.16,u*0.38,0,0,6.283);c.fill();} // queue de cheval
  c.fillStyle=skin;c.beginPath();c.arc(hx-hr*0.98,hy+hr*0.1,hr*0.2,0,6.283);c.fill();c.beginPath();c.arc(hx+hr*0.98,hy+hr*0.1,hr*0.2,0,6.283);c.fill();
  c.fillStyle=hair;c.beginPath();c.arc(hx,hy,hr,0,6.283);c.fill();
  if(style===2){c.beginPath();c.arc(hx,hy-hr*0.95,hr*0.38,0,6.283);c.fill();} // chignon
  if(style===3){c.fillStyle=shade(shirt,-0.18);c.beginPath();c.arc(hx,hy,hr*1.02,Math.PI*1.05,Math.PI*1.95);c.closePath();c.fill();} // capuche/casquette
  c.fillStyle='rgba(255,255,255,0.18)';c.beginPath();c.ellipse(hx-hr*0.3,hy-hr*0.35,hr*0.35,hr*0.2,-0.5,0,6.283);c.fill();
}
function drawStudents(c,time){
  const slot=R?((R.qi||0)%3):0;
  L.students.forEach((st,i)=>{
    const t=L.tables[st.t];
    drawStudent(c,t,st,time,R&&R.hand>0&&((i+slot)%4===0));
  });
}

/* ---------- Professeur (de face), sa bulle ---------- */
function drawProf(c,time){
  if(!R||!(R.profT>0)){drawProfBody(c,time);return;}
  const u=CELL,P=L.prof,cx=(P.x+1)*u,fy=(P.y+2)*u,p=clamp(1-R.profT/1.3,0,1);
  const jp=clamp(p/0.5,0,1),jump=Math.sin(Math.PI*jp)*u*1.2;
  const salto=(R.badN%2===0)?Math.PI*2*(1-Math.pow(1-jp,2)):0;
  const zoom=1+0.26*Math.sin(Math.PI*clamp(p/0.8,0,1));
  const sh=p>0.5?Math.sin((p-0.5)*70)*u*0.07*(1-p):0;
  const cyb=fy-u;
  c.save();c.translate(cx+sh,cyb-jump);c.rotate(salto);c.scale(zoom,zoom);c.translate(-cx,-cyb);
  drawProfBody(c,time);c.restore();
  const a=clamp(R.profT/0.5,0,1);
  c.save();c.globalAlpha=a;c.fillStyle='#e03131';c.strokeStyle='#fff';c.lineWidth=Math.max(2,u*0.06);
  const ex=cx+u*1.0,ey=P.y*u-u*0.1-jump*0.5;
  c.font='900 '+Math.round(u*1.2)+'px ui-rounded,system-ui,sans-serif';c.textAlign='center';c.textBaseline='middle';
  c.strokeText('!',ex,ey);c.fillText('!',ex,ey);c.restore();
}
function drawProfBody(c,time){
  const P=L.prof,u=CELL,cx=(P.x+1)*u,top=P.y*u,bob=Math.sin(time*1.6)*u*0.03;
  // ombre
  c.fillStyle='rgba(40,25,10,0.22)';c.beginPath();c.ellipse(cx,top+2*u-u*0.05,u*1.0,u*0.18,0,0,6.283);c.fill();
  // jambes
  c.fillStyle='#34405a';rr(c,cx-u*0.5,top+1.55*u,u*0.4,u*0.45,u*0.1);c.fill();rr(c,cx+u*0.1,top+1.55*u,u*0.4,u*0.45,u*0.1);c.fill();
  c.fillStyle='#2b2b2b';rr(c,cx-u*0.56,top+1.9*u,u*0.5,u*0.12,u*0.06);c.fill();rr(c,cx+u*0.06,top+1.9*u,u*0.5,u*0.12,u*0.06);c.fill();
  // veston
  c.fillStyle='#3b5b92';rr(c,cx-u*0.78,top+0.82*u+bob,u*1.56,u*0.92,u*0.3);c.fill();
  c.fillStyle='#f8f9fa';c.beginPath();c.moveTo(cx-u*0.2,top+0.85*u+bob);c.lineTo(cx+u*0.2,top+0.85*u+bob);c.lineTo(cx,top+1.3*u+bob);c.closePath();c.fill();
  c.fillStyle='#e03131';c.beginPath();c.moveTo(cx-u*0.07,top+1.0*u+bob);c.lineTo(cx+u*0.07,top+1.0*u+bob);c.lineTo(cx+u*0.11,top+1.5*u+bob);c.lineTo(cx,top+1.6*u+bob);c.lineTo(cx-u*0.11,top+1.5*u+bob);c.closePath();c.fill();
  // bras + livre + craie
  c.fillStyle='#34548a';rr(c,cx-u*0.98,top+0.95*u+bob,u*0.3,u*0.7,u*0.15);c.fill();
  c.fillStyle='#d6336c';rr(c,cx-u*1.0,top+1.45*u+bob,u*0.42,u*0.3,u*0.05);c.fill();
  c.fillStyle='#fff';c.fillRect(cx-u*0.98,top+1.48*u+bob,u*0.36,u*0.04);
  const wave=R&&R.hand>0?Math.sin(time*10)*0.35:0;
  c.save();c.translate(cx+u*0.82,top+0.98*u+bob);c.rotate(-0.5+wave);c.fillStyle='#34548a';rr(c,-u*0.15,0,u*0.3,u*0.7,u*0.15);c.fill();
  c.fillStyle='#f5c9a0';c.beginPath();c.arc(0,u*0.72,u*0.15,0,6.283);c.fill();c.fillStyle='#fff';c.fillRect(-u*0.03,u*0.78,u*0.06,u*0.22);c.restore();
  // tête
  const hy=top+0.5*u+bob;
  c.fillStyle='#f5c9a0';c.beginPath();c.arc(cx,hy,u*0.44,0,6.283);c.fill();
  c.fillStyle='#8a8f98';c.beginPath();c.arc(cx,hy-u*0.12,u*0.46,Math.PI*1.0,Math.PI*2.0);c.fill();

function histCount(){try{const h=store.get('history',[]);return Array.isArray(h)?h.length:0;}catch(e){return 0;}}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));}
function collectGames(mode){
  if(mode==='game')return(R&&R.log&&R.log.length)?[runToGame(R)]:[];
  let h=store.get('history',[]);h=Array.isArray(h)?h.slice():[];
  if(R&&R.log&&R.log.length&&!R.saved)h.push(runToGame(R));
  return h;

function aggRows(rows){
  const o={tot:rows.length,bon:0,faux:0,timeout:0,'bloqué':0,sec:0,n:0};
  rows.forEach(r=>{if(o[r.res]!==undefined)o[r.res]++;if(r.res==='bon'||r.res==='faux'){o.sec+=(+r.sec||0);o.n++;}});
  o.pct=o.tot?Math.round(100*o.bon/o.tot):0;o.avg=o.n?Math.round(10*o.sec/o.n)/10:0;return o;
}
function buildReport(games,mode){

  h+='<h1>Rapport Maths Snake</h1><p class="sub"><b>Prénom : '+esc(name)+'</b> · Classe : '+esc(klass)+' · '+(mode==='all'?games.length+' partie'+(games.length>1?'s':'')+' cumulée'+(games.length>1?'s':''):'Partie du '+esc(stampFR(new Date(games[0].date))))+' · Exporté le '+esc(stampFR())+'</p>';
  if(rp.howto)h+='<div class="box"><b>Comment rendre ce rapport à ton professeur</b><ol><li>Enregistre ce fichier sur l’ordinateur (nom : <code>'+esc(fname)+'</code>).</li><li>Ouvre ta session informatique, puis l’espace <b>« MA CLASSE »</b>.</li><li>Dépose ce fichier dans l’espace « MA CLASSE » (glisser-déposer ou bouton de dépôt).</li><li>Vérifie qu’il apparaît bien dans la liste, puis préviens ton professeur.</li></ol></div>';
  if(rp.stats){
    h+='<h2>Statistiques</h2><div class="cards"><div class="card"><b>'+games.length+'</b>partie'+(games.length>1?'s':'')+'</div><div class="card"><b>'+(mode==='all'?totScore:(games[0].score||0))+'</b>'+(mode==='all'?'points au total':'points')+'</div><div class="card"><b>'+best+'</b>meilleur score</div><div class="card"><b>'+all.pct+' %</b>de réussite</div><div class="card"><b>'+all.avg+' s</b>temps moyen</div></div>';
    h+='<table><tr><th>Chapitre</th><th>Questions</th><th>Bon</th><th>Faux</th><th>Temps écoulé</th><th>Bloqué</th><th>Réussite</th><th>Temps moyen</th></tr>';
    Object.keys(byCh).forEach(k=>{const a=aggRows(byCh[k]);h+='<tr><td>'+esc(lab(k))+'</td><td>'+a.tot+'</td><td>'+a.bon+'</td><td>'+a.faux+'</td><td>'+a.timeout+'</td><td>'+a['bloqué']+'</td><td>'+a.pct+' %</td><td>'+a.avg+' s</td></tr>';});
    h+='<tr><th>Global</th><th>'+all.tot+'</th><th>'+all.bon+'</th><th>'+all.faux+'</th><th>'+all.timeout+'</th><th>'+all['bloqué']+'</th><th>'+all.pct+' %</th><th>'+all.avg+' s</th></tr></table>';
    if(mode==='all'&&games.length>1){h+='<table><tr><th>Partie</th><th>Date</th><th>Chapitres</th><th>Niveau final</th><th>Score</th><th>Fin</th></tr>';

  }

  }
  h+='<footer>Généré par Maths Snake — Tom Rougeaud — CC BY-NC 4.0. Ce fichier est créé sur ton appareil : rien n’a été envoyé sur internet.</footer></main></body></html>';
  return{html:h,fname:fname};
}
function exportReport(mode){
  try{

}

  let t=clamp((px-e.sx)/e.sw,0,1);if(e.inv)t=1-t;const v=Math.round(e.min+t*(e.max-e.min));
  const k={sl_chrono:'chrono',sl_diff:'diff',sl_tick:'tick',sl_lives:'lives'}[e.id];
  if(k&&S.set[k]!==v){S.set[k]=v;saveSettings();}
}
function goMenu(){S.screen='menu1';blurInput();}
function handleButton(id){
  SFX.unlock();SFX.click();
  if(id.indexOf('chap:')===0){const k=id.slice(5),cs=S.set.chaps;
    if(k==='TOUS')S.set.chaps=ALL_CH.slice();
    else{const i=cs.indexOf(k);if(i>=0){if(cs.length>1)cs.splice(i,1);}else{cs.push(k);S.set.chaps=ALL_CH.filter(x=>cs.indexOf(x)>=0);}}
    saveSettings();return;}
  if(id.indexOf('rp:')===0){const k=id.slice(3);S.set.report[k]=!S.set.report[k];saveSettings();return;}
  switch(id){
    case'fs_on':tryFullscreen();S.screen='menu1';break;
    case'fs_skip':S.screen='menu1';break;
    case'next':S.screen='menu2';break;
    case'back':S.screen='menu1';break;
    case'start':case'replay':startGame();break;
    case'restart':startGame();break;
    case'resume':S.screen='play';break;
    case'pause':if(S.screen==='play')S.screen='pause';else if(S.screen==='pause')S.screen='play';break;
    case'menu':goMenu();break;
    case'about':S.from=S.screen;S.screen='about';S.scrollY=0;break;
    case'priv':S.from=S.screen;S.screen='priv';S.scrollY=0;break;
    case'backMenu':S.screen=S.from||'menu1';break;
    case'mute':S.set.mute=!SFX.isMuted();SFX.setMuted(S.set.mute);saveSettings();break;
    case'rep':S.from=S.screen;S.histN=histCount();S.screen='rep';break;
    case'repGame':exportReport('game');break;
    case'repAll':exportReport('all');break;
    case'histClear':if(S.confirmClear>0){store.set('history',[]);S.histN=0;S.confirmClear=0;toast('Historique effacé');}else S.confirmClear=4;break;
    case'dataExport':dataExport();break;
    case'dataImport':dataImport();break;
    case'dataClear':dataClear();break;
    case'link':try{window.open(LINKEDIN,'_blank','noopener');}catch(e){}break;
  }
}
let swipe=null,drag=null,scr=null;
function ptr(e){const r=cv.getBoundingClientRect();return{x:(e.clientX-r.left)*(W/r.width),y:(e.clientY-r.top)*(H/r.height)};}
cv.addEventListener('pointerdown',e=>{
  const p=ptr(e),h=hitTest(p.x,p.y);
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(h){
    if(h.type==='slider'){drag=h;setSlider(h,p.x);SFX.unlock();}
    else if(h.type==='input'){SFX.unlock();}
    else{if(S.focus)blurInput();handleButton(h.id);}
    return;
  }
  if(S.focus)blurInput();
  if(S.screen==='play')swipe={x:p.x,y:p.y};
  else if(S.screen==='about'||S.screen==='priv')scr={y:p.y,s:S.scrollY||0};
});
cv.addEventListener('pointermove',e=>{
  const p=ptr(e);
  if(drag){setSlider(drag,p.x);return;}
  if(scr){S.scrollY=clamp(scr.s-(p.y-scr.y),0,S.scrollMax||0);return;}
  const h=hitTest(p.x,p.y);S.hover=h?h.id:null;cv.style.cursor=h?(h.type==='input'?'text':'pointer'):'default';
  if(swipe&&S.screen==='play'){const dx=p.x-swipe.x,dy=p.y-swipe.y;
    if(Math.hypot(dx,dy)>Math.max(12,CELL*0.35)){pushDir(Math.abs(dx)>Math.abs(dy)?{x:Math.sign(dx),y:0}:{x:0,y:Math.sign(dy)});swipe={x:p.x,y:p.y};}}
});
cv.addEventListener('click',e=>{ // le focus du champ caché se prend au clic (après le focus natif du canvas)
  const p=ptr(e),h=hitTest(p.x,p.y);if(h&&h.type==='input')focusInput(h.id);
});
function endPtr(){drag=null;swipe=null;scr=null;}
cv.addEventListener('wheel',e=>{if(S.screen==='about'||S.screen==='priv'){e.preventDefault();S.scrollY=clamp((S.scrollY||0)+e.deltaY,0,S.scrollMax||0);}},{passive:false});
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('pointerleave',()=>{S.hover=null;});

document.addEventListener('keydown',e=>{
  try{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const k=e.key;
    if(S.focus){if(k==='Enter'||k==='Escape'||k==='Tab'){e.preventDefault();blurInput();}return;}
    const lk=k.length===1?k.toLowerCase():k;
    const dmap={ArrowUp:{x:0,y:-1},ArrowDown:{x:0,y:1},ArrowLeft:{x:-1,y:0},ArrowRight:{x:1,y:0},z:{x:0,y:-1},w:{x:0,y:-1},s:{x:0,y:1},q:{x:-1,y:0},a:{x:-1,y:0},d:{x:1,y:0}};
    if(S.screen==='play'&&dmap[lk]){e.preventDefault();pushDir(dmap[lk]);return;}
    if(k===' '){e.preventDefault();if(S.screen==='play')S.screen='pause';else if(S.screen==='pause')S.screen='play';return;}
    if(S.screen==='fs'){if(k==='Enter')handleButton('fs_on');return;}
    if(lk==='r'&&(S.screen==='play'||S.screen==='pause'||S.screen==='end')){startGame();return;}
    if(lk==='m'||k==='Escape'){if(S.screen!=='menu1'){if(S.screen==='about'||S.screen==='priv')S.screen=S.from||'menu1';else goMenu();}return;}
    if(k==='Enter'){if(S.screen==='menu1')S.screen='menu2';else if(S.screen==='menu2')startGame();else if(S.screen==='end')startGame();else if(S.screen==='pause')S.screen='play';return;}
    if(S.screen==='play'&&R&&/^[0-9+\-*]$/.test(k)){
      R.cheat.buf=(R.cheat.buf+k).slice(-3);const b=R.cheat.buf;
      if(b==='194'){R.cheat.show=7;R.cheat.used.push('194');R.cheat.buf='';floater(W/2,H*0.45,'Indice !','#f08c00');}
      else if(b==='+++'){R.speedMult=Math.min(4,R.speedMult*1.5);R.cheat.used.push('+++');R.cheat.buf='';floater(W/2,H*0.45,'Vitesse +50 %','#1971c2');}
      else if(b==='---'){R.speedMult=Math.max(0.25,R.speedMult/1.5);R.cheat.used.push('---');R.cheat.buf='';floater(W/2,H*0.45,'Vitesse −','#1971c2');}
      else if(b==='***'){R.diff=Math.min(5,R.diff+1);R.cheat.used.push('***');R.cheat.buf='';floater(W/2,H*0.45,'Niveau '+R.diff,'#7048e8');}
    }
  }catch(err){S.err=String(err&&err.message||err);S.screen='error';}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.screen==='play')S.screen='pause';});

/* =========================================================
   9. BOUCLE PRINCIPALE + GARDE-FOU ANTI-CRASH
   ========================================================= */
function resize(){
  const r=cv.getBoundingClientRect();DPR=clamp(window.devicePixelRatio||1,1,3);
  W=Math.max(320,r.width);H=Math.max(300,r.height);
  // Tactile ? (le mode « version ordinateur » du navigateur gonfle W : on se base sur la taille physique de l’écran)
  let coarse=false;try{coarse=!!(window.matchMedia&&matchMedia('(pointer:coarse)').matches);}catch(e){}
  const sw=Math.min(screen.width||W,screen.height||H);
  TOUCH=coarse||(('ontouchstart' in window||navigator.maxTouchPoints>0)&&sw<=900);
  DW=TOUCH?Math.min(sw,W):W;K=TOUCH?Math.max(1,W/DW):1;
  const small=TOUCH?DW<=900:W<820;
  ROT=small&&W>H*1.15&&H/K<500;MOB=small&&!ROT&&H>=W*0.95; // ROT : téléphone en paysage ; MOB : mobile / tablette en portrait
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  const oc=COLS,or=ROWS;buildWorld();buildBg();
  if(R&&!R.over&&(oc!==COLS||or!==ROWS)){relayoutRun();if(S.screen==='play')S.screen='pause';}
}
function render(){
  const c=ctx;c.setTransform(DPR,0,0,DPR,0,0);c.clearRect(0,0,W,H);clearUI();
  if(ROT){if(S.screen==='play')S.screen='pause';drawRotate(c);return;}
  const sc=S.screen;
  if(sc==='play'||sc==='pause'){
    if(sc==='play'){
      c.save();if(R.shake>0)c.translate((Math.random()-0.5)*CELL*0.3*(R.shake/0.45),(Math.random()-0.5)*CELL*0.3*(R.shake/0.45));
      drawWorld(c,true);c.restore();
    }else drawPause(c);
    drawHUD(c);
  }
  else if(sc==='end')drawEnd(c);
  else if(sc==='menu1')drawMenu1(c);
  else if(sc==='menu2')drawMenu2(c);
  else if(sc==='rep')drawRep(c);
  else if(sc==='about')drawTextPage(c,TXT.aboutTitle,TXT.about,false);
  else if(sc==='priv')drawTextPage(c,TXT.privTitle,TXT.priv,true);
  else if(sc==='error')drawError(c);
  else drawFS(c);
  if(S.msgT>0){const t=S.msg,f=fu()*1.1;c.save();c.font='800 '+f+'px '+FONT;const w=c.measureText(t).width+f*2;c.globalAlpha=clamp(S.msgT,0,1);
    c.fillStyle='#212529';rr(c,W/2-w/2,H-f*3.2,w,f*2,f);c.fill();c.fillStyle='#fff';c.textAlign='center';c.textBaseline='middle';c.fillText(t,W/2,H-f*2.2);c.restore();}
}
let lastTs=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(0.05,Math.max(0,(ts-lastTs)/1000||0));lastTs=ts;
  try{
    if(S.confirmClear>0){S.confirmClear-=dt;}
    if(S.screen!=='error')update(dt);
    render();
  }catch(e){
    S.err=String(e&&e.message||e);S.screen='error';try{console.error(e);}catch(_){}
    try{ctx.setTransform(DPR,0,0,DPR,0,0);clearUI();drawError(ctx);}catch(_){}
  }
}
/* Icônes de l’onglet et de l’écran d’accueil : dessinées par le code (aucun fichier externe) */
function setIcons(){
  try{
    const mk=(n,bleed)=>{const k=document.createElement('canvas');k.width=k.height=n;drawLogo(k.getContext('2d'),0,0,n,{bleed:bleed});return k.toDataURL('image/png');};
    const add=(rel,href,sz)=>{const l=document.createElement('link');l.rel=rel;if(sz)l.sizes=sz;l.href=href;document.head.appendChild(l);};
    add('icon',mk(64,false),'64x64');add('apple-touch-icon',mk(180,true),'180x180');
  }catch(e){}
}
setIcons();
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,200));
resize();
try{cv.focus({preventScroll:true});}catch(e){}
requestAnimationFrame(frame);
})();
</script>
